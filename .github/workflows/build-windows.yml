# Builds the Windows standalone app on a GitHub-hosted Windows runner, since
# PyInstaller can't cross-compile a Windows .exe from macOS.
#
# NOT wired up to run automatically yet (kept local-only, per the "don't push
# yet" ask) — trigger it manually (workflow_dispatch) once this repo has a
# remote, or add a push/tag trigger when you're ready to.
name: Build Windows app

on:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller build/xrd_tools.spec --noconfirm --distpath dist --workpath build_output

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRD-Tools-windows
          path: dist/XRD Tools/
